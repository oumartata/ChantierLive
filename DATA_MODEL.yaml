phase: "5B"
status: "VALIDATED"
updated_at: "2026-09-14"

conventions:
  primary_keys: "uuid généré côté client pour objets hors-ligne, sinon côté serveur"
  tenant_key: "project_id obligatoire pour toute donnée privée de chantier"
  organization_key: "organization_id uniquement pour fonctions entreprise"
  timestamps: [created_at_server, updated_at_server]
  attribution: [created_by, updated_by]
  concurrency: "revision entier incrémenté exclusivement par le serveur"
  deletion: "pas de suppression physique métier; statut, archived_at ou revoked_at"
  money: "bigint en unité FCFA; jamais float"
  timezone: "timestamptz UTC; affichage selon utilisateur"
  identifiers: "e-mail et téléphone normalisés; jetons stockés hachés"

domains:
  identity: [profiles, profile_identifiers]
  organization: [organizations, organization_memberships]
  tenancy: [projects, project_memberships, membership_permissions]
  access: [invitations, role_transfers, support_access_grants]
  construction: [phase_templates, phase_template_items, project_phases, phase_versions, daily_logs, daily_log_versions]
  evidence: [media_assets, media_links, documents, document_versions, comments]
  finance: [budgets, budget_versions, expense_categories, expenses, expense_versions, receipts, advances, advance_events]
  commercial: [plan_catalog_items, plan_catalog_item_versions, plan_catalog_item_validations, project_plans, quotes, quote_versions, change_orders, change_order_versions, plan_engineer_designations, plan_validations, catalog_access_grants, project_plan_shares]
  workflow: [approval_requests, approval_decisions, incidents, incident_events]
  service: [project_licenses, license_payments, notifications, notification_preferences, report_exports, share_links]
  integrity: [sync_operations, sync_conflicts, audit_events, duplicate_candidates, private_object_uploads, plan_catalog_item_upload_targets]

versioning:
  stable_identity_tables: [project_phases, daily_logs, budgets, expenses, documents, project_plans, quotes, change_orders]
  append_only_version_tables: [phase_versions, daily_log_versions, budget_versions, expense_versions, document_versions, quote_versions, change_order_versions]
  append_only_event_tables: [advance_events, approval_decisions, incident_events, audit_events, plan_validations]
  current_pointer: "la table identité peut pointer vers la dernière version; les anciennes restent consultables"
  approved_finance_correction: "nouvelle version ou contre-écriture liée avec motif, jamais UPDATE du montant validé"

membership:
  roles: [OWNER, CONTRACTOR, SITE_MANAGER]
  owner_profiles: [PRIMARY, CO_OWNER]
  defaults:
    primary_owner: 1
    co_owners_max: 2
    primary_contractor: 1
    site_managers_max: 2
  platform_admin: "rôle plateforme séparé, absent des adhésions métier ordinaires"

critical_transactions:
  accept_invitation: "verrou invitation + vérification cible + contrôle quotas + création adhésion + consommation jeton"
  transfer_primary_role: "vérifications + bascule atomique + révocation délégations incompatibles + audit"
  publish_version: "contrôle révision + insertion version + changement pointeur + audit"
  financial_decision: "cible une version exacte + décision append-only + audit"
  commercial_decision: "cible une version exacte (devis ou avenant) + décision append-only + montant contractuel recalculé + audit ; un avenant non décidé ne bloque que son propre périmètre"
  plan_technical_validation: "habilitation active vérifiée au moment de la décision (plan_engineer_designations) + décision append-only (identité, version, décision) + audit ; jamais déduite d'une habilitation seulement passée"
  private_object_access: "trois autorisations distinctes (préparer, finaliser, lire), jamais déduites l'une de l'autre ; is_active_project_member est une condition d'appartenance nécessaire mais jamais suffisante, chaque entity_type enregistre son propre contrôle fin (registre par domaine, refus par défaut si non enregistré) ; branche organisation = owner_profile_id, OU désignation ingénieur active ET soumission explicite de la version concernée (dépend de lots futurs, voie refusée sans stub tant qu'absente) ; chemin de stockage toujours construit serveur, jamais une autorisation à lui seul ; revalidation à chaque requête, jamais un accès mis en cache. Atomicité métier : le passage à FINALIZED et la création/liaison de l'objet métier consommateur (ex. media_assets) s'exécutent dans LA MÊME transaction PostgreSQL, après que le contrôle Storage a déjà produit son attestation (voir privileged_boundary) ; un échec de cette liaison annule toute la transaction — l'opération reste non-FINALIZED et récupérable, jamais un FINALIZED sans sa liaison métier attendue. Idempotence : même operation_uuid = toujours la même opération logique ; une reprise après panne ou après abandon d'une candidate (voir upload_immutability) peut exiger un nouvel attempt_id et une nouvelle clé candidate, mais ne crée jamais une seconde ligne d'opération ni un second objet métier pour la même operation_uuid."
  license_activation: "paiement contrôlé + activation + audit, sans modifier rôles"
  sync_apply: "operation_uuid unique + base_revision + résultat mémorisé"

storage:
  buckets: [project-media, project-documents, generated-reports]
  canonical_path: "{project_id}/{entity_type}/{entity_id}/{version_id}/{filename}"
  canonical_path_organization: "{organization_id}/{entity_type}/{entity_id}/{version_id}/{filename} — préfixe distinct pour les objets privés d'organisation (catalogue) sans project_id ; bucket dédié ou préfixe supplémentaire dans l'existant = choix technique, pas un arbitrage métier"
  public_bucket: false
  access: "politique RLS liée à project_id extrait du chemin et adhésion active ; pour un chemin organisation, remplacer par private_object_access (branche organisation) — le chemin seul, dans les deux cas, ne constitue jamais une autorisation"
  downloads: "URL signée courte ou flux serveur autorisé ; une URL déjà émise reste valide jusqu'à sa propre expiration, aucune révocation immédiate promise — seule l'émission d'une NOUVELLE URL est bloquée dès le retrait du droit"
  upload_immutability: "trois objets distincts par tentative, jamais deux confondus : (1) source temporaire, reçoit l'upload via l'URL signée cliente ; (2) candidate, clé distincte construite et écrite EXCLUSIVEMENT côté serveur à partir de la source temporaire, sans aucune URL cliente autorisant son écriture ; (3) référence FINALIZED, qui pointe directement vers la candidate vérifiée et gagnante, sans nouvelle copie. Le serveur contrôle les octets de la candidate (empreinte figée à l'opération dès sa création = une condition à vérifier sur les octets réels, jamais une garantie qui s'y substitue). La transition FINALIZED (UPDATE conditionnel : attempt_id courant + expiration encore valide + droits revérifiés à l'instant présent) enregistre la clé exacte de la candidate gagnante comme référence permanente de la ligne. Un rejeu de l'URL cliente ne peut donc modifier que la source temporaire, jamais la candidate ni la référence gagnante. Seules les lectures passant par la référence gagnante enregistrée en base sont servies ; aucune reconstruction de chemin côté lecteur."
  candidate_non_rewritability: "la candidate n'étant jamais exposée à une URL cliente, l'usage unique de l'URL signée cliente n'est pas requis pour la protéger — elle ne protège que la source temporaire. Aucun code serveur ne réécrit les octets d'une candidate déjà contrôlée (le mécanisme ne comporte aucune étape de copie qui pourrait le faire). VÉRIFIÉ EMPIRIQUEMENT (local, storage-api v1.72.1, fixtures isolées nettoyées) : (1) écriture séquentielle sans upsert sur une clé déjà occupée = refusée, octets d'origine intacts ; (2) rejeu d'une URL signée vers un chemin distinct (source→candidate) = refusé, la candidate n'est jamais créée par ce chemin — CONFIRME l'isolation source temporaire/candidate. POINT RÉFUTÉ, exigence de conception ajoutée : deux écritures serveur concurrentes sans upsert visant la MÊME clé (ex. double exécution du même attempt) ont TOUTES DEUX abouti (200/200) côté fournisseur, avec écrasement silencieux du premier gagnant par le second, sans erreur pour aucun appelant — le seul contrôle 'sans upsert' de Storage n'est donc pas atomique sous concurrence réelle. Correction : « un seul appel en vol » est insuffisant, il ne borne que la concurrence, pas la répétition dans le temps. Règle retenue : une clé candidate ne reçoit JAMAIS plus d'une tentative d'écriture ; aucune réémission automatique du PUT vers cette même clé après un timeout ou une réponse incertaine. Sur résultat incertain (ex. timeout réseau sans réponse), le serveur ne retente pas le PUT sur cette candidate : il vérifie l'objet déjà présent à cette clé (existe-t-il ? octets conformes ?) pour lever l'incertitude, ou abandonne définitivement cette tentative et ouvre un NOUVEL attempt_id avec une NOUVELLE clé candidate — jamais une réouverture de l'écriture sur l'ancienne. Une tentative expirée ne peut ni écrire une seconde fois ni finaliser (rappel). Le contrôle des octets après écriture reste une ligne de défense complémentaire, jamais un substitut à cette règle du « au plus une écriture »."
  cleanup_policy_final_protection: "le nettoyage protège explicitement toute clé référencée par une ligne FINALIZED (jamais éligible, quel que soit son âge) ; seules les candidates perdantes ou expirées et non référencées par aucune ligne FINALIZED sont éligibles."
  cleanup_policy: "un objet PENDING/FINALIZING n'est orphelin que s'il dépasse l'expiration de son attempt_id ET qu'aucun attempt_id plus récent n'est en cours ; le nettoyage applique le même UPDATE conditionnel par attempt_id que la finalisation, jamais une suppression aveugle ; aucun objet FINALIZED n'est jamais purgé par ce mécanisme."
  privileged_boundary: "les RPC de prise en charge et de validation finale s'exécutent sous la session utilisateur authentifiée (auth.uid(), jamais un user_id fourni par le client) et revérifient les droits à chaque transition, y compris la finale ; seule la copie Storage elle-même s'exécute côté serveur avec des identifiants privilégiés (service_role), jamais transmis ni accessibles au navigateur. Identité et attestation de contrôle sont deux choses distinctes qui ne se déduisent jamais l'une de l'autre : l'attestation qu'un contrôle réel des octets a eu lieu sur la candidate n'est écrite QUE par le code serveur privilégié (service_role) au moment où il effectue ce contrôle — jamais par un paramètre fourni par l'appelant, jamais dérivable de la seule session utilisateur authentifiée. La transition FINALIZED (attempt_id courant + expiration valide + droits revérifiés) exige EN PLUS la présence de cette attestation pour l'attempt_id courant ; un appelant authentifié qui invoque la RPC de finalisation sans qu'un contrôle Storage privilégié ait réellement eu lieu est donc refusé, quels que soient ses droits par ailleurs."

excluded_from_database:
  - "mots de passe: gérés par Supabase Auth"
  - "codes OTP en clair"
  - "secrets Orange Money, Moov Money ou fournisseur"
  - "coordonnées bancaires inutiles"
  - "promesse d'authenticité absolue d'une preuve"

next_phase: "5C - contrats API, synchronisation et opérations serveur"
