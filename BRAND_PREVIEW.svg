    <text x="86" y="69" font-size="15" fill="#65716B">Dernière mise à jour : maintenant</text>
    <rect x="24" y="88" width="185" height="30" rx="8" fill="#126B54"/><text x="50" y="109" font-size="14" font-weight="600" fill="#FFFFFF">Voir le chantier</text>
