  <g transform="translate(102 520)" font-family="Inter,Arial,sans-serif">
    <rect width="448" height="128" rx="18" fill="#F8FAF9" stroke="#D8E2DE"/>
    <circle cx="54" cy="46" r="18" fill="#16794F"/><path d="M46 46l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
