    <path d="M31 74V49L60 28l29 21v25" fill="none" stroke="#126B54" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="104" cy="24" r="12" fill="#BF570F"/>
    <text x="145" y="62" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700" fill="#17211D">Chantier<tspan fill="#126B54">Live</tspan></text>
    <text x="148" y="96" font-family="Inter,Arial,sans-serif" font-size="20" fill="#65716B">Suivi de chantier à distance</text>
  </g>
  <text x="102" y="280" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#17211D">Confiance visible</text>
  <text x="102" y="317" font-family="Inter,Arial,sans-serif" font-size="21" fill="#65716B">Votre chantier, visible et suivi où que vous soyez.</text>
  <g transform="translate(102 362)" font-family="Inter,Arial,sans-serif">
    <g><rect width="170" height="105" rx="16" fill="#126B54"/><text x="18" y="72" font-size="17" fill="#FFFFFF">#126B54</text></g>
    <g transform="translate(188)"><rect width="170" height="105" rx="16" fill="#0A4637"/><text x="18" y="72" font-size="17" fill="#FFFFFF">#0A4637</text></g>
    <g transform="translate(376)"><rect width="170" height="105" rx="16" fill="#BF570F"/><text x="18" y="72" font-size="17" fill="#FFFFFF">#BF570F</text></g>
    <g transform="translate(564)"><rect width="170" height="105" rx="16" fill="#F3EEE4" stroke="#D9D2C5"/><text x="18" y="72" font-size="17" fill="#17211D">#F3EEE4</text></g>
    <g transform="translate(752)"><rect width="170" height="105" rx="16" fill="#17211D"/><text x="18" y="72" font-size="17" fill="#FFFFFF">#17211D</text></g>
