<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Direction visuelle ChantierLive</title>
  <desc id="desc">Planche de marque provisoire présentant le symbole, les couleurs, la typographie et quelques composants.</desc>
  <rect width="1200" height="760" fill="#F3EEE4"/>
  <rect x="54" y="48" width="1092" height="664" rx="28" fill="#FFFFFF"/>
  <g transform="translate(102 100)">
