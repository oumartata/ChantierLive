machines:
  invitation:
    initial: PENDING
    terminal: [ACCEPTED, REFUSED, REVOKED, EXPIRED]
    transitions:
      - {from: PENDING, to: ACCEPTED, guard: "token_valid_and_target_allowed"}
      - {from: PENDING, to: REFUSED, guard: "invitee_action"}
      - {from: PENDING, to: REVOKED, guard: "authorized_sender"}
      - {from: PENDING, to: EXPIRED, guard: "server_time_after_expiry"}
  project:
    initial: DRAFT
    states: [DRAFT, ACTIVE, SUSPENDED, COMPLETED, ARCHIVED, READ_ONLY]
    transitions:
      - {from: DRAFT, to: ACTIVE, guard: "minimum_data_and_license_or_pilot"}
      - {from: ACTIVE, to: SUSPENDED, guard: "authorized_reason"}
      - {from: SUSPENDED, to: ACTIVE, guard: "suspension_resolved"}
      - {from: ACTIVE, to: COMPLETED, guard: "authorized_confirmation"}
      - {from: COMPLETED, to: ARCHIVED, guard: "authorized_confirmation"}
      - {from: ACTIVE, to: READ_ONLY, guard: "license_grace_ended"}
      - {from: READ_ONLY, to: ACTIVE, guard: "license_renewed"}
  record:
    applies_to: [journal, media, document]
    initial: DRAFT
    states: [DRAFT, PUBLISHED, SUPERSEDED, ARCHIVED]
    transitions:
      - {from: DRAFT, to: PUBLISHED, guard: "authorized_and_valid"}
      - {from: PUBLISHED, to: SUPERSEDED, guard: "replacement_with_reason"}
      - {from: PUBLISHED, to: ARCHIVED, guard: "authorized_archive (sauf journal : interdit par D158)"}
  # Journal quotidien tel que réalisé (M036/M037, B021/B022). Détaille
  # « record » pour le journal ; statuts stockés en français dans
  # daily_logs.status (BROUILLON, PUBLIE, ARCHIVE). PUBLISHED -> ARCHIVED
  # retirée pour le journal (D158) : un journal publié n'est jamais archivé
  # ni supprimé, seule la correction est possible ; ARCHIVED n'est
  # atteignable que depuis DRAFT.
  daily_log:
    initial: DRAFT
    states: [DRAFT, PUBLISHED, ARCHIVED]
    stored_as: {DRAFT: BROUILLON, PUBLISHED: PUBLIE, ARCHIVED: ARCHIVE}
    terminal: [ARCHIVED]
    rules:
      - "Un seul journal actif (brouillon ou publié) par auteur, chantier et date (D146, D155)."
      - "Brouillon visible et modifiable par son auteur seul (D144, D145) ; jamais supprimé physiquement."
      - "Un journal publié n'est plus modifié : contenu, date et état figés ; seule la version courante change (D152, D157)."
      - "Lecture des journaux publiés et de tout l'historique par tout membre actif, propriétaires compris ; jamais un brouillon (D156)."
      - "Après publication, nouveau brouillon même auteur, chantier et date refusé : passer par une correction (D155)."
      - "Aucun délai de correction (D154)."
      - "Un journal publié n'est jamais archivé ni supprimé (D158)."
    transitions:
      - {from: DRAFT, to: DRAFT, guard: "author_active_contractor_or_site_manager_expected_revision (modification, D145)"}
      - {from: DRAFT, to: ARCHIVED, guard: "author_active_expected_revision_audited (D147)"}
      - {from: DRAFT, to: PUBLISHED, guard: "author_active_expected_revision_and_at_least_one_section (D153) ; crée la version 1, heure serveur, audit"}
      - {from: PUBLISHED, to: PUBLISHED, guard: "correction : author_or_active_contractor (D151), reason_required, expected_version, at_least_one_section ; nouvelle version liée publiée immédiatement (D152), audit avec motif"}
  # Versions publiées d'un journal (daily_log_versions, insertion seule).
  daily_log_version:
    initial: PUBLISHED
    states: [PUBLISHED, SUPERSEDED]
    terminal: [SUPERSEDED]
    rule: "Jamais modifiée ni supprimée ; la version remplacée reste lisible dans l'historique (AC058). État dérivé, sans colonne : la version courante est daily_logs.current_version_id, les autres sont SUPERSEDED."
    transitions:
      - {from: PUBLISHED, to: SUPERSEDED, guard: "linked_correction_created_with_reason (supersedes_version_id, D152)"}
  # Étapes de chantier (M033 + M040, B019/B020, D177–D179) ; statuts stockés
  # en français dans project_phases.status. Deux mesures distinctes (D177) :
  # « Avancement déclaré par l'entreprise » (pondéré) et « Avancement validé »
  # (étapes VALIDEE / étapes actives d'un plan publié ; non calculable sinon).
  project_phase:
    initial: DRAFT
    states: [DRAFT, PUBLISHED, DECLARED_COMPLETE, VALIDATED, REFUSED]
    stored_as: {DRAFT: BROUILLON, PUBLISHED: PUBLIEE, DECLARED_COMPLETE: TERMINEE, VALIDATED: VALIDEE, REFUSED: REFUSEE}
    terminal: [VALIDATED]
    rules:
      - "Étape validée figée : libellé, poids, progression, dates prévues, archivage (seule la position peut changer)."
      - "Étape publiée modifiable par l'entreprise avec motif et trace (restructuration, dates prévues)."
      - "Validation et refus par le propriétaire principal seul ; copropriétaire en lecture (D179)."
      - "Déclarer terminée ne modifie pas la progression déclarée (D177)."
    transitions:
      - {from: DRAFT, to: PUBLISHED, guard: "contractor_publishes_plan_weights_sum_100"}
      - {from: [PUBLISHED, REFUSED], to: DECLARED_COMPLETE, guard: "contractor_active (D179)"}
      - {from: DECLARED_COMPLETE, to: VALIDATED, guard: "owner_primary_active"}
      - {from: DECLARED_COMPLETE, to: REFUSED, guard: "owner_primary_active_with_reason"}
  # Documents tels que réalisés (M039, B028, D169–D176) ; statuts stockés en
  # français. Le remplacement ne change pas l'état : il ajoute une version
  # liée (document_versions, insertion seule), la précédente reste lisible.
  document:
    initial: DRAFT
    states: [DRAFT, PUBLISHED, ARCHIVED]
    stored_as: {DRAFT: BROUILLON, PUBLISHED: PUBLIE, ARCHIVED: ARCHIVE}
    terminal: [ARCHIVED]
    rules:
      - "Brouillon visible par son auteur seul (D170) ; visibilité modifiable seulement en brouillon, figée après publication (D173)."
      - "Nouvelle version seulement sur un document publié, par la partie qui l'a déposé ; publiée immédiatement (D172, AC112)."
      - "Archivage motivé par la partie propriétaire ; versions conservées et consultables (D174, BR067)."
    transitions:
      - {from: DRAFT, to: PUBLISHED, guard: "author_active_confirmed_visibility (D170, D173)"}
      - {from: DRAFT, to: ARCHIVED, guard: "author_with_reason (D174)"}
      - {from: PUBLISHED, to: PUBLISHED, guard: "new_version_by_owning_party (D172)"}
      - {from: PUBLISHED, to: ARCHIVED, guard: "owning_party_with_reason (D174)"}
  financial_record:
    applies_to: [expense, budget_version]
    initial: DRAFT
    states: [DRAFT, PUBLISHED, APPROVED, REJECTED, DISPUTED, SUPERSEDED, CANCELLED]
    rule: "APPROVED/REJECTED/DISPUTED are never edited in place"
    transitions:
      - {from: DRAFT, to: PUBLISHED, guard: "authorized_and_valid"}
      - {from: PUBLISHED, to: APPROVED, guard: "authorized_owner_online_verified"}
      - {from: PUBLISHED, to: REJECTED, guard: "authorized_owner_with_reason"}
      - {from: [PUBLISHED, APPROVED], to: DISPUTED, guard: "authorized_party_with_reason"}
      - {from: [PUBLISHED, APPROVED, REJECTED, DISPUTED], to: SUPERSEDED, guard: "linked_replacement_created"}
      - {from: [PUBLISHED, APPROVED, REJECTED, DISPUTED], to: CANCELLED, guard: "linked_counter_entry_created"}
  advance:
    initial: DRAFT
    note: "DRAFT n'existe que côté client (déclaration en ligne uniquement) ; le serveur crée directement DECLARED. RECEIVED = versement confirmé (D126, BR108)."
    states: [DRAFT, DECLARED, RECEIVED, DISPUTED, CANCELLED]
    terminal: [CANCELLED]
    transitions:
      - {from: DRAFT, to: DECLARED, guard: "owner_primary_or_contractor_with_advance_requirement_set (D126, AC171)"}
      - {from: DECLARED, to: RECEIVED, guard: "current_holder_of_opposite_role_not_declarant (D133)"}
      - {from: DECLARED, to: DISPUTED, guard: "owner_primary_or_contractor_with_reason (D132)"}
      - {from: RECEIVED, to: DISPUTED, guard: "owner_primary_or_contractor_with_reason (D130, D132)"}
      - {from: [DECLARED, RECEIVED, DISPUTED], to: CANCELLED, guard: "declarant_with_current_authorized_role_and_reason (D132)"}
  approval:
    initial: PENDING
    terminal: [APPROVED, REJECTED, INFO_REQUESTED, CORRECTION_REQUESTED, CANCELLED]
    rule: "reopen creates a new linked approval"
  # Réalisé par M038 (B024, D159–D166) ; statuts stockés en français.
  incident:
    initial: OPEN
    states: [OPEN, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    stored_as: {OPEN: OUVERT, ASSIGNED: AFFECTE, IN_PROGRESS: EN_COURS, RESOLVED: RESOLU, CLOSED: CLOS, CANCELLED: ANNULE}
    terminal: [CLOSED, CANCELLED]
    rules:
      - "Création directe OPEN en ligne, aucun brouillon serveur (D161)."
      - "Aucune réouverture d'un incident clos : nouvel incident lié (D165)."
      - "Changement de responsable possible dans tout état non terminal, sans changer d'état sauf OPEN -> ASSIGNED (D163)."
      - "Correction des champs par événement avec motif, dans tout état non terminal (D164)."
      - "Toute autre transition est refusée ; historique incident_events en insertion seule."
    transitions:
      - {from: OPEN, to: ASSIGNED, guard: "responsible_selected_by_contractor_or_owner_primary (D163)"}
      - {from: [OPEN, ASSIGNED], to: IN_PROGRESS, guard: "authorized_update (D162)"}
      - {from: IN_PROGRESS, to: RESOLVED, guard: "resolution_entered_by_authorized_update"}
      - {from: RESOLVED, to: IN_PROGRESS, guard: "authorized_update_with_reason (D165)"}
      - {from: RESOLVED, to: CLOSED, guard: "authorized_close (D162)"}
      - {from: OPEN, to: CANCELLED, guard: "authorized_close_with_reason (D165)"}
  sync_item:
    initial: QUEUED
    states: [QUEUED, UPLOADING, SYNCED, FAILED, CONFLICT, CANCELLED]
    transitions:
      - {from: QUEUED, to: UPLOADING, guard: "network_and_retry_policy"}
      - {from: UPLOADING, to: SYNCED, guard: "server_ack_same_uuid"}
      - {from: UPLOADING, to: FAILED, guard: "retryable_or_permanent_error"}
      - {from: UPLOADING, to: CONFLICT, guard: "stale_server_revision"}
      - {from: FAILED, to: QUEUED, guard: "user_or_automatic_retry"}
      - {from: CONFLICT, to: QUEUED, guard: "user_resolved_new_revision"}
  license:
    initial: PENDING
    states: [PENDING, ACTIVE, EXPIRING, GRACE, READ_ONLY, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, guard: "manual_payment_verified_or_pilot"}
      - {from: ACTIVE, to: EXPIRING, guard: "reminder_window"}
      - {from: [ACTIVE, EXPIRING], to: GRACE, guard: "expiry_reached"}
      - {from: GRACE, to: READ_ONLY, guard: "30_days_elapsed"}
      - {from: [EXPIRING, GRACE, READ_ONLY], to: ACTIVE, guard: "renewal_verified"}
  change_order_version:
    initial: ESTIMATE
    terminal: [ACCEPTED, REFUSED, SUPERSEDED]
    transitions:
      - {from: ESTIMATE, to: PROPOSED, guard: "contractor_active_and_total_positive_and_quote_accepted (D119, D121)"}
      - {from: PROPOSED, to: ACCEPTED, guard: "owner_primary_decision_expected_revision (D117)"}
      - {from: PROPOSED, to: REFUSED, guard: "owner_primary_decision_expected_revision (D117)"}
      - {from: PROPOSED, to: SUPERSEDED, guard: "contractor_proposes_new_version_same_change_order (D120)"}
  change_order_execution:
    initial: NOT_AUTHORIZED
    terminal: [AUTHORIZED]
    transitions:
      - {from: NOT_AUTHORIZED, to: AUTHORIZED, guard: "contractor_active_and_change_order_accepted_once_insert_only (D125)"}
