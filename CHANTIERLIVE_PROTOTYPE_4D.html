<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChantierLive - Prototype Phase 4D</title>
<style>
:root{--g:#126b54;--gd:#0a4637;--o:#bf570f;--sand:#f3eee4;--ink:#17211d;--muted:#65716b;--line:#d8e2de;--white:#fff;--red:#b42318;--pale:#e7f4ef}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif;font-size:16px}.lab{padding:16px;min-height:100vh}.labbar{max-width:1180px;margin:0 auto 14px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.labbar h1{font-size:20px;margin:0 auto 0 0}.control{display:grid;gap:4px;font-size:12px;font-weight:700}.control select,.control button{height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 12px;font:inherit;color:var(--ink)}.control button.active{background:var(--g);color:#fff;border-color:var(--g)}.device-actions{display:flex;gap:6px}
.stage{max-width:1180px;margin:auto;display:flex;justify-content:center}.app{background:#f8faf9;border:1px solid #cdd8d3;box-shadow:0 16px 45px rgba(23,33,29,.14);overflow:hidden;transition:max-width .2s;width:100%;min-height:700px}.app.mobile{max-width:390px;border-radius:24px;min-height:760px;position:relative;padding-bottom:72px}.app.desktop{max-width:1180px;border-radius:16px;display:grid;grid-template-columns:240px 1fr}
.side{display:none;background:var(--gd);color:#fff;padding:24px 16px}.desktop .side{display:block}.logo{font-size:21px;font-weight:800;margin-bottom:28px}.logo span{color:#42b894}.side button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dcebe6;padding:12px;border-radius:9px;font:inherit;margin:3px 0}.side button.active{background:var(--g);color:#fff;font-weight:700}.shell{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.mobile .top{padding:0 16px}.desktop .top .logo{display:none;margin:0}.status{font-size:12px;font-weight:700;color:var(--g);background:var(--pale);padding:7px 10px;border-radius:18px}.status.off{color:var(--o);background:#fff3e8}.content{padding:24px}.mobile .content{padding:18px 16px}.title-row{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:18px}h2{font-size:25px;margin:0 0 5px}h3{font-size:16px;margin:0 0 8px}p{margin:4px 0}.muted{color:var(--muted);font-size:14px}.grid{display:grid;gap:14px}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:repeat(2,1fr)}.mobile .grid.three,.mobile .grid.two{grid-template-columns:1fr}.mobile .compact-two{grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.metric strong{display:block;font-size:24px;margin:6px 0}.progress{height:9px;border-radius:8px;background:#e5ece9;overflow:hidden}.progress i{display:block;height:100%;background:var(--g)}.alert{background:#fff3e8;border-radius:10px;padding:13px 15px;margin:14px 0}.alert.danger{background:#fff0ee;color:var(--red)}.btn{min-height:46px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:#fff;font-weight:700;padding:0 17px;cursor:pointer}.btn.secondary{background:#fff;color:var(--g)}.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}.mobile .btn.wide{width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.mobile .actions{display:grid}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{min-height:48px;border:1px solid #8d9a94;border-radius:10px;background:#fff;padding:11px;font:inherit}.field textarea{min-height:92px;resize:vertical}.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #e5ece9}.item:last-child{border:0}.chip{font-size:12px;font-weight:700;background:#edf1ef;border-radius:16px;padding:6px 9px;white-space:nowrap}.chip.green{background:var(--pale);color:var(--g)}.chip.orange{background:#fff3e8;color:var(--o)}.chip.red{background:#fff0ee;color:var(--red)}.photos{grid-template-columns:repeat(3,1fr)}.photo{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(140deg,#d7e5de,var(--sand));display:grid;place-items:center;color:var(--g);font-weight:800}.bottom{display:none}.mobile .bottom{display:grid;position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);align-items:center}.bottom button{border:0;background:transparent;font-size:11px;color:var(--muted)}.bottom button.active{color:var(--g);font-weight:800}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.2);display:none;z-index:20}.toast.show{display:block}.modal{position:fixed;inset:0;background:rgba(23,33,29,.48);display:none;place-items:center;padding:16px;z-index:10}.modal.show{display:grid}.modal-box{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mobile .photos{grid-template-columns:1fr 1fr}
@media(max-width:700px){.labbar h1{width:100%}.app.desktop{grid-template-columns:180px 1fr}.grid.three{grid-template-columns:1fr 1fr}.photos{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="lab">
 <div class="labbar">
  <h1>Prototype ChantierLive - Phase 4D</h1>
  <label class="control">Écran<select id="screenSelect" aria-label="Choisir un écran"></select></label>
  <div class="control"><span>Affichage</span><div class="device-actions"><button id="mobileMode" class="active" type="button">Mobile</button><button id="desktopMode" type="button">Ordinateur</button></div></div>
  <div class="control"><span>Réseau</span><button id="networkToggle" type="button">Simuler hors ligne</button></div>
 </div>
 <div class="stage"><div id="app" class="app mobile"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-box"><h3 id="modalTitle">Action</h3><div id="modalContent"></div><div class="actions"><button class="btn" id="modalConfirm">Confirmer</button><button class="btn secondary" id="modalClose">Annuler</button></div></div></div>
<script>
const screens=[
 ['login','Connexion'],['invite','Invitation sécurisée'],['owner','Accueil propriétaire'],['contractor','Accueil entrepreneur'],
 ['manager','Accueil terrain'],['journal','Journal quotidien'],['expense','Nouvelle dépense'],['gallery','Galerie photos'],
 ['decision','Décision'],['sync','Synchronisation'],['finance','Finances'],['participants','Participants']
];
const state={screen:'login',device:'mobile',online:true};
const app=document.getElementById('app'),select=document.getElementById('screenSelect'),toast=document.getElementById('toast'),modal=document.getElementById('modal');
screens.forEach(([id,name])=>select.add(new Option(name,id)));
const btn=(label,go,cls='')=>`<button class="btn ${cls}" data-go="${go}">${label}</button>`;
const metric=(label,value)=>`<div class="card metric"><span class="muted">${label}</span><strong>${value}</strong></div>`;
const item=(name,meta,status='Traçable',tone='green')=>`<div class="item"><div><b>${name}</b><p class="muted">${meta}</p></div><span class="chip ${tone}">${status}</span></div>`;
function nav(){
 const map={owner:['Accueil','Journal','Photos','Finances','Décisions'],contractor:['Chantiers','Journaux','Finances','Participants','Rapports'],manager:["Aujourd'hui",'Journal','Photos','Dépenses','Incidents']};
 const role=['owner','decision','finance','invite'].includes(state.screen)?'owner':['contractor','expense','participants'].includes(state.screen)?'contractor':'manager';
 return (map[role]||map.owner).map((n,i)=>`<button class="${i===0?'active':''}" type="button">${n}</button>`).join('');
}
function shell(content,publicView=false){
 return `${publicView?'':`<aside class="side"><div class="logo">Chantier<span>Live</span></div>${nav()}</aside>`}<section class="shell"><header class="top"><div class="logo">Chantier<span>Live</span></div><span class="status ${state.online?'':'off'}">${state.online?'En ligne - synchronisé':'Hors connexion'}</span></header><main class="content">${content}</main>${publicView?'':`<nav class="bottom" aria-label="Navigation"><button class="active">Accueil</button><button>Journal</button><button>Photos</button><button>Finances</button><button>Plus</button></nav>`}</section>`;
}
const title=(h,s)=>`<div class="title-row"><div><h2>${h}</h2><p class="muted">${s}</p></div></div>`;
function render(){
 select.value=state.screen; app.className='app '+state.device;
 const V={
 login:()=>shell(`${title('Bon retour','Suivez votre chantier où que vous soyez.')}<div class="card" style="max-width:520px;margin:auto"><div class="field"><label>Téléphone ou e-mail</label><input value="+223 76 00 00 00"></div><div class="field"><label>Mot de passe</label><input type="password" value="12345678"></div><div class="actions">${btn('Se connecter','owner','wide')}${btn('Voir une invitation','invite','secondary wide')}</div></div>`,true),
 invite:()=>shell(`${title('Invitation au chantier','Vérifiez les informations avant d’accepter.')}<div class="card"><h3>Villa familiale Kati</h3><p>Oumar Touré vous invite comme propriétaire principal.</p><p class="muted">Kati, Koulikoro - expire le 21/09/2026</p></div><div class="alert">Invitation sécurisée, révocable et à usage unique. Votre identifiant doit correspondre au destinataire.</div><div class="actions">${btn("Accepter l’invitation",'owner','wide')}${btn('Refuser','login','secondary wide')}</div>`,true),
 owner:()=>shell(`${title('Bonsoir Oumar','Villa familiale Kati - élévation des murs')}<div class="grid three">${metric('Progression','64 %')}${metric('Dépensé','8 450 000 F CFA')}${metric('Reste','4 050 000 F CFA')}</div><div class="alert"><b>2 décisions en attente.</b> Une dépense et une phase demandent votre réponse.</div><div class="grid two"><div class="card"><h3>Progression</h3><div class="progress"><i style="width:64%"></i></div><p class="muted">Élévation des murs</p></div><div class="list">${item('Journal publié','Aujourd’hui à 18:40')}${item('6 photos ajoutées','Capturées dans l’application')}</div></div><div class="actions">${btn('Voir les décisions','decision','wide')}</div>`),
 contractor:()=>shell(`${title('Mes chantiers','3 chantiers actifs')}<div class="grid three">${metric('Actifs','3')}${metric('Alertes','2')}${metric('À synchroniser','0')}</div><div class="list">${item('Villa familiale Kati','Élévation des murs - 64 %')}${item('Maison Dialakorodji','Fondations - 38 %','Journal attendu','orange')}${item('Rénovation Badalabougou','Finitions - 82 %','À corriger','orange')}</div><div class="actions">${btn('Déclarer une dépense','expense','wide')}</div>`),
 manager:()=>shell(`${title('Travail du jour','Villa familiale Kati - lundi 14 septembre')}${state.online?'':'<div class="alert"><b>Travail hors connexion disponible.</b> Vos brouillons restent sur ce téléphone.</div>'}<div class="grid compact-two">${metric('Journal','À faire')}${metric('Photos en attente','2')}${metric('File locale','3')}</div><div class="actions">${btn('Faire le journal','journal','wide')}${btn('Voir la synchronisation','sync','secondary wide')}</div>`),
 journal:()=>shell(`${title('Journal du 14/09/2026','Brouillon sauvegardé automatiquement')}<div class="field"><label>Travaux réalisés</label><textarea>Élévation du mur nord terminée. Préparation du coffrage.</textarea></div><div class="grid two"><div class="field"><label>Nombre d’ouvriers</label><input value="8"></div><div class="field"><label>Météo</label><select><option>Ensoleillé</option></select></div></div><div class="field"><label>Difficultés</label><textarea>Retard de livraison du sable.</textarea></div><div class="alert">Brouillon enregistré sur cet appareil. Publication en ligne uniquement.</div><div class="actions"><button class="btn wide" data-action="saveJournal">Publier le journal</button>${btn('Voir la file','sync','secondary wide')}</div>`),
 expense:()=>shell(`${title('Nouvelle dépense','Villa familiale Kati - brouillon')}<div class="grid two"><div><div class="field"><label>Montant</label><input value="325 000 F CFA"></div><div class="field"><label>Catégorie</label><select><option>Matériaux - Ciment</option></select></div><div class="field"><label>Description</label><textarea>50 sacs de ciment pour le mur nord.</textarea></div></div><div class="card"><h3>Justificatif</h3><div class="photo">APERÇU DU REÇU</div><p class="muted">Photo importée - auteur et date enregistrés</p></div></div><div class="alert">ChantierLive enregistre cette déclaration mais ne détient ni ne transfère l’argent.</div><div class="actions"><button class="btn wide" data-action="publishExpense">Publier la dépense</button></div>`),
 gallery:()=>shell(`${title('Photos du chantier','86 photos - 2 en attente')}<div class="grid photos">${['Mur nord','Coffrage','Façade','Stock ciment','Mur est','Poteaux'].map((x,i)=>`<div class="card"><div class="photo">${x}</div><p><b>${x}</b></p><span class="chip ${i===1?'orange':'green'}">${i===1?'Photo importée':'Capturée dans l’application'}</span></div>`).join('')}</div><div class="actions"><button class="btn wide" data-action="addPhoto">Ajouter des photos</button></div>`),
 decision:()=>shell(`${title('Examiner une dépense','Achat de ciment')}<div class="grid three">${metric('Montant','325 000 F CFA')}${metric('Déclarant','Moussa Traoré')}${metric('Statut','À examiner')}</div><div class="card"><h3>Justificatif et description</h3><p>50 sacs de ciment pour l’élévation du mur nord.</p><div class="photo" style="max-width:340px">APERÇU DU REÇU</div></div><div class="alert">Votre décision sera datée, attribuée et conservée dans l’historique.</div><div class="actions"><button class="btn wide" data-action="approve">Approuver</button><button class="btn secondary wide" data-action="correction">Demander correction</button><button class="btn danger wide" data-action="refuse">Refuser</button></div>`),
 sync:()=>shell(`${title('Synchronisation','3 opérations locales')}<div class="alert"><b>Connexion instable.</b> Aucune donnée financière ne sera écrasée automatiquement.</div><div class="grid two"><div class="list">${item('Journal du 14/09','Prêt à envoyer','En attente','orange')}${item('2 photos','Compression terminée','Envoi')}${item('Dépense ciment','Deux versions existent','Conflit','red')}</div><div class="card"><h3>Deux versions existent</h3><div class="compare">${metric('Sur ce téléphone','325 000 F CFA')}${metric('Sur le serveur','320 000 F CFA')}</div><p class="muted">Comparez avant de choisir. L’autre version restera dans l’historique.</p><button class="btn wide" data-action="resolve">Comparer et choisir</button></div></div>`),
 finance:()=>shell(`${title('Finances du chantier','Actualisé aujourd’hui à 18:40')}<div class="grid three">${metric('Budget initial','12 500 000 F CFA')}${metric('Dépensé','8 450 000 F CFA')}${metric('Restant estimé','4 050 000 F CFA')}</div><div class="list">${item('Ciment - 325 000 F CFA','14/09/2026','En attente','orange')}${item('Fer à béton - 780 000 F CFA','12/09/2026','Approuvée')}${item('Transport sable - 95 000 F CFA','10/09/2026','Approuvée')}</div><div class="alert">Les acomptes sont déclaratifs. Vérifiez toujours la preuve de l’opérateur.</div><div class="actions"><button class="btn wide" data-action="export">Exporter le rapport</button></div>`),
 participants:()=>shell(`${title('Participants','4 membres actifs')}<div class="grid three">${metric('Membres actifs','4')}${metric('Invitations','1')}${metric('Rôles principaux','2')}</div><div class="list">${item('Oumar Touré','Propriétaire principal')}${item('Moussa Traoré','Entrepreneur')}${item('Amadou Koné','Chef de chantier')}${item('+223 70 00 00 00','Invitation en attente','Expire dans 3 jours','orange')}</div><div class="alert">Retirer un rôle principal exige une connexion, une confirmation et un motif.</div><div class="actions"><button class="btn wide" data-action="invite">Inviter une personne</button></div>`)
 };
 app.innerHTML=V[state.screen]();
}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600)}
function showModal(title,content,confirm='Confirmer'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalContent').innerHTML=content;document.getElementById('modalConfirm').textContent=confirm;modal.classList.add('show')}
select.addEventListener('change',e=>{state.screen=e.target.value;render()});
document.getElementById('mobileMode').onclick=()=>{state.device='mobile';document.getElementById('mobileMode').classList.add('active');document.getElementById('desktopMode').classList.remove('active');render()};
document.getElementById('desktopMode').onclick=()=>{state.device='desktop';document.getElementById('desktopMode').classList.add('active');document.getElementById('mobileMode').classList.remove('active');render()};
document.getElementById('networkToggle').onclick=e=>{state.online=!state.online;e.target.textContent=state.online?'Simuler hors ligne':'Rétablir le réseau';render()};
document.addEventListener('click',e=>{
 const go=e.target.closest('[data-go]');if(go){state.screen=go.dataset.go;render();return}
 const a=e.target.closest('[data-action]');if(!a)return;
 const actions={
  saveJournal:()=>state.online?(showToast('Journal publié et horodaté.'),state.screen='manager',setTimeout(render,600)):showToast('Brouillon conservé sur ce téléphone.'),
  publishExpense:()=>showModal('Publier cette dépense ?','<p>Montant déclaré : <b>325 000 F CFA</b></p><p>Une fois publiée, toute correction restera dans l’historique.</p>','Publier'),
  addPhoto:()=>showToast('Choisissez : appareil photo ou galerie.'),
  approve:()=>showModal('Approuver cette dépense ?','<p>Votre approbation sera datée et conservée.</p>','Approuver'),
  correction:()=>showModal('Demander une correction','<div class="field"><label>Motif obligatoire</label><textarea placeholder="Expliquez la correction demandée"></textarea></div>','Envoyer'),
  refuse:()=>showModal('Refuser cette dépense','<div class="field"><label>Motif obligatoire</label><textarea placeholder="Expliquez le refus"></textarea></div>','Refuser'),
  resolve:()=>showModal('Choisir une version','<div class="compare"><div class="card"><b>Téléphone</b><p>325 000 F CFA</p></div><div class="card"><b>Serveur</b><p>320 000 F CFA</p></div></div><p>L’autre version restera consultable.</p>','Choisir'),
  export:()=>showToast('Rapport PDF préparé.'),
  invite:()=>showModal('Inviter une personne','<div class="field"><label>Téléphone ou e-mail</label><input value="+223 "></div><div class="field"><label>Rôle</label><select><option>Chef de chantier</option><option>Entrepreneur</option><option>Copropriétaire</option></select></div>','Envoyer'),
 };(actions[a.dataset.action]||(()=>{}))();
});
document.getElementById('modalClose').onclick=()=>modal.classList.remove('show');
document.getElementById('modalConfirm').onclick=()=>{modal.classList.remove('show');showToast('Action enregistrée et horodatée.')};
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
render();
</script>
</body>
</html>
