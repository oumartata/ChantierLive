decisions:
  - {id: D001, status: VALIDATED, value: "PWA responsive en premier"}
  - {id: D002, status: VALIDATED, value: "Invitation bidirectionnelle propriétaire-entrepreneur"}
  - {id: D003, status: VALIDATED, value: "Une licence chantier peut être payée par l'une des deux parties"}
  - {id: D004, status: VALIDATED, value: "Le paiement ne confère aucun droit supplémentaire"}
  - {id: D005, status: VALIDATED, value: "Quatre rôles techniques au MVP"}
  - {id: D006, status: VALIDATED, value: "Copropriétaire = profil OWNER non principal, pas nouveau rôle technique"}
  - {id: D007, status: VALIDATED, value: "Brouillon modifiable; publié versionné; validé corrigé par contre-écriture"}
  - {id: D008, status: VALIDATED, value: "Écritures hors ligne avec UUID et révision serveur; pas de last-write-wins financier"}
  - {id: D009, status: VALIDATED, value: "Géolocalisation facultative avec consentement"}
  - {id: D010, status: VALIDATED, value: "Photo marquée Capturée dans l'application ou Importée, jamais Vérifiée"}
  - {id: D011, status: VALIDATED, value: "Acomptes déclaratifs uniquement, sans détention de fonds"}
  - {id: D012, status: VALIDATED, value: "Licence 12 mois; grâce 30 jours; lecture seule ensuite"}
  - {id: D013, status: VALIDATED, value: "Aucun quota sur dépenses, acomptes ou écritures financières"}
  - {id: D014, status: VALIDATED, value: "Entité organisation présente dès le MVP avec interface minimale"}
  - {id: D015, status: VALIDATED, value: "Pilote français simple; architecture traduisible"}
  - {id: D016, status: VALIDATED, value: "Activation Mobile Money manuelle au pilote"}
  - {id: D017, status: VALIDATED, value: "Nom BatiSuivi abandonné; nouveau nom avant design haute fidélité"}
  - {id: D018, status: VALIDATED, value: "Code d'invitation ≠ OTP; compte non vérifié reste provisional"}
  - {id: D019, status: VALIDATED, value: "Administrateur plateforme sans accès ordinaire aux contenus privés"}
  - {id: D020, status: VALIDATED, value: "Accès support exceptionnel, temporaire, motivé et audité"}
  - {id: D021, status: VALIDATED, value: "Phase 2A: objectifs, glossaire, rôles et permissions"}
  - {id: D022, status: VALIDATED, value: "Phase 2B: FR, BR, NFR et critères d'acceptation"}
  - {id: D023, status: VALIDATED, value: "Phase 2C: cas d'utilisation, parcours, états et cas limites"}
  - {id: D024, status: PROPOSED, value: "Navigation mobile limitée à cinq entrées principales par rôle"}
  - {id: D025, status: PROPOSED, value: "Trois accueils métier distincts: propriétaire, entrepreneur et chef de chantier"}
  - {id: D026, status: PROPOSED, value: "Administration plateforme dans une interface séparée"}
  - {id: D027, status: VALIDATED, value: "Phase 3A: arborescence, routes et navigation UX"}
  - {id: D028, status: PROPOSED, value: "Dix-huit gabarits couvrent les 64 écrans du MVP"}
  - {id: D029, status: PROPOSED, value: "Wireframes sans marque ni couleurs définitives avant dénomination"}
  - {id: D030, status: PROPOSED, value: "Statuts réseau et synchronisation visibles dans toute interface authentifiée"}
  - {id: D031, status: VALIDATED, value: "Phase 3B: wireframes, composants et états UX"}
  - {id: D032, status: PROPOSED, value: "Vingt-cinq écrans critiques spécifiés en détail; les autres héritent des gabarits"}
  - {id: D033, status: PROPOSED, value: "Français simple avec libellés d'action de cinq mots maximum"}
  - {id: D034, status: PROPOSED, value: "Avertissements obligatoires pour preuves, acomptes, rapports et paiement de licence"}
  - {id: D035, status: VALIDATED, value: "Phase 3C: écrans critiques, formulaires et contenus UX"}
  - {id: D036, status: PROPOSED, value: "Liste finale de noms: ChantierVue, BatiRelais ou ChantierLien"}
  - {id: D037, status: PROPOSED, value: "Recommandation actuelle: ChantierVue, sous réserve des vérifications officielles"}
  - {id: D038, status: VALIDATED, value: "Nom de travail retenu par le fondateur: ChantierLive, sous réserve des vérifications officielles"}
  - {id: D039, status: VALIDATED, value: "Planothèque légère en V1: plans 2D, PDF et vues 3D fixes; visualisation 3D interactive en V2"}
  - {id: D040, status: VALIDATED, value: "Vitrine publique des entrepreneurs en V1; avis confirmés et recommandations transparentes en V2"}
  - {id: D041, status: VALIDATED, value: "Direction visuelle ChantierLive: Confiance visible, palette vert profond, sable et orange action"}
  - {id: D042, status: VALIDATED, value: "UI kit 4B: composants accessibles, une action dominante, statuts toujours textuels"}
  - {id: D043, status: VALIDATED, value: "Responsive: navigation basse mobile, latérale ordinateur, contenu central limité à 1200 px"}
  - {id: D044, status: VALIDATED, value: "Phase 4C: douze maquettes haute fidélité couvrent les parcours MVP prioritaires sur mobile et ordinateur"}
  - {id: D045, status: VALIDATED, value: "Phase 4D: prototype cliquable couvrant les parcours propriétaire, entrepreneur, terrain, finance et synchronisation"}
  - {id: D046, status: VALIDATED, value: "Tests humains différés au recrutement de 3 chefs de chantier et 2 propriétaires à distance; aucun résultat simulé"}
  - {id: D047, status: VALIDATED, value: "Une seule PWA et une seule base de code; mobile et ordinateur désignent uniquement deux affichages responsive"}
  - {id: D048, status: VALIDATED, value: "Architecture 5A: Next.js et TypeScript pour une PWA responsive unique"}
  - {id: D049, status: VALIDATED, value: "Supabase PostgreSQL, Auth et Storage avec RLS obligatoire et refus par défaut"}
  - {id: D050, status: VALIDATED, value: "IndexedDB et file d'opérations UUID avec révision serveur pour le hors-ligne"}
  - {id: D051, status: VALIDATED, value: "Région Supabase Paris ou Francfort à décider après tests et examen juridique APDP"}
  - {id: D052, status: VALIDATED, value: "Fournisseurs externes accessibles par adaptateurs interchangeables"}
  - {id: D053, status: VALIDATED, value: "Modèle 5B: 43 tables regroupées en identité, chantier, preuves, finance, workflow, service et intégrité"}
  - {id: D054, status: VALIDATED, value: "Toute donnée privée de chantier porte project_id et applique une politique RLS de refus par défaut"}
  - {id: D055, status: VALIDATED, value: "Objets publiés versionnés; décisions, événements financiers et audit append-only"}
  - {id: D056, status: VALIDATED, value: "Fichiers dans trois buckets privés avec chemin contenant project_id et contrôle RLS"}
  - {id: D057, status: VALIDATED, value: "PLATFORM_ADMIN ne contourne jamais automatiquement les données privées des chantiers"}
  - {id: D058, status: VALIDATED, value: "Contrats 5C: lectures RLS, commandes SQL transactionnelles et fonctions serveur externes séparées"}
  - {id: D059, status: VALIDATED, value: "Toute commande rejouable utilise operation_uuid; acteur, rôle et permissions proviennent du serveur"}
  - {id: D060, status: VALIDATED, value: "Synchronisation par lots de 25 opérations, ordre par entité et dépendances explicites"}
  - {id: D061, status: VALIDATED, value: "Le pull utilise un curseur serveur monotone par chantier et non l'heure du téléphone"}
  - {id: D062, status: VALIDATED, value: "Les médias sont transférés séparément et deviennent visibles après finalisation contrôlée"}
  - {id: D063, status: VALIDATED, value: "Plan 6A: 11 lots de développement séquentiels avec portes de validation bloquantes"}
  - {id: D064, status: VALIDATED, value: "Estimation MVP: 105 jours effectifs économique ou 163 jours prudent"}
  - {id: D065, status: VALIDATED, value: "Estimation jusqu'au candidat commercial: 140 jours économique ou 223 jours prudent"}
  - {id: D066, status: VALIDATED, value: "Hypothèse initiale de 10 à 14 semaines remplacée par l'estimation détaillée"}
  - {id: D067, status: VALIDATED, value: "Aucun développement ChantierLive avant FuturePro et ArchivaPro; dépôt séparé ensuite"}
  - {id: D068, status: VALIDATED, value: "Phase 6B: 72 tests catalogués restent NOT_RUN jusqu'à exécution réelle"}
  - {id: D069, status: VALIDATED, value: "Aucune Alpha si RLS croisée, intégrité financière ou restauration échoue"}
  - {id: D070, status: VALIDATED, value: "Objectif pilote RPO 24 h et RTO 8 h ouvrées, sans engagement SLA"}
  - {id: D071, status: VALIDATED, value: "Alpha 3 à 5 chantiers; Bêta 10 à 15; résultats observés et non extrapolés"}
  - {id: D072, status: VALIDATED, value: "Commercialisation bloquée sans APDP, CGU, confidentialité, nom et restauration validés"}
  - {id: D073, status: VALIDATED, value: "Après validation 6B, dossier préparation complet et développement maintenu à 0 % jusqu'aux prérequis"}
  - {id: D074, status: VALIDATED, value: "Dossier préparatoire ChantierLive clôturé à 100 % le 15 septembre 2026; reprise par L00/B001 après FuturePro et ArchivaPro"}
  - {id: D075, status: VALIDATED, value: "Le 15/09/2026, le fondateur autorise le démarrage progressif de ChantierLive pendant la pause de FuturePro, malgré l'ancienne condition D067."}
  - {id: D076, status: VALIDATED, value: "B008/M003 : une organisation possède un propriétaire principal (organizations.owner_profile_id). Le transfert de propriété n'est ni implémenté ni décidé dans M003."}
  - {id: D077, status: VALIDATED, value: "B008/M003 : aucune limite du nombre d'organisations par profil (owner_profile_id n'est pas unique sur organizations)."}
  - {id: D078, status: VALIDATED, value: "B008/M003 : organization_memberships ne porte aucune colonne role ; l'adhésion est binaire (active tant que revoked_at est NULL)."}
  - {id: D079, status: VALIDATED, value: "B008/M003 : création automatique d'organisation (BR012/FR014) et permissions des collaborateurs différées à un lot ultérieur ; M003 ne crée ni trigger ni fonction de provisioning, ni policy de chantier."}
  - {id: D080, status: VALIDATED, value: "B008/M003 : l'adhésion à une organisation (organization_memberships) est distincte du rôle sur un chantier (project_memberships/membership_role) ; l'une ne se substitue pas à l'autre."}
  - {id: D081, status: VALIDATED, value: "B008/M003 : le paiement de la licence ne confère aucun droit supplémentaire au sein d'une organisation (cohérent avec D004)."}
  - {id: D082, status: VALIDATED, value: "B010/M004a : pour PHASE_EDIT_DRAFT et EXPENSE_PUBLISH, CONTRACTOR a un droit natif ; SITE_MANAGER exige une délégation active (membership_permissions) ; OWNER (PRIMARY et CO_OWNER) est explicitement refusé sur ces deux codes, sans exception par délégation. Corrige l'ambiguïté du 'C' d'owner_primary dans PERMISSIONS.csv."}
  - {id: D083, status: VALIDATED, value: "Retour métier agence, 2026-09-24 : catalogue de plans propre à chaque agence (organisation, table plan_catalog_items) ; le client peut aussi apporter son propre plan, déposé par le professionnel habilité (table project_plans, distincte du catalogue)."}
  - {id: D084, status: VALIDATED, value: "Dépôt d'un plan, validation technique et publication (chantier ou catalogue) sont trois actes distincts ; aucun n'est déduit de DOCUMENT_UPLOAD, qui reste inchangé. Dépôt (PLAN_DEPOSIT) et publication (PLAN_PUBLISH) sont des permissions chantier concrètes ; la validation technique est réservée à l'ingénieur désigné (D092), jamais déduite du rôle CONTRACTOR — aucune ligne PERMISSIONS.csv pour cet acte, gouverné par plan_engineer_designations."}
  - {id: D085, status: VALIDATED, value: "Montant contractuel = devis accepté + avenants acceptés (BR094) ; une estimation avant accord reste non contractuelle sans imposer de table distincte (statut sur quote_versions : ESTIMATE/PROPOSED/ACCEPTED/REFUSED/SUPERSEDED)."}
  - {id: D086, status: VALIDATED, value: "Dépenses et justificatifs internes privés par défaut envers le client (BR098, EXPENSE_VIEW) ; le client consulte le montant contractuel, les paiements reconnus, le reste dû, les étapes et les photos (FR172). Le budget interne (FR069/BUDGET_VIEW) est traité séparément par D090 (même principe de confidentialité, sans exception de seuil)."}
  - {id: D087, status: VALIDATED, value: "Toute prestation supplémentaire exige un avenant accepté avant son autorisation d'exécution DANS L'APPLICATION (EXECUTION_AUTHORIZE) — distinct de l'exécution physique des travaux, jamais contrôlée par ChantierLive. Un avenant non décidé ne bloque que son propre périmètre, jamais les travaux déjà convenus. La préparation des phases (B019) reste possible avant tout accord commercial et n'est pas conditionnée par cette décision."}
  - {id: D088, status: VALIDATED, value: "Avance fixée par l'entreprise avant démarrage puis solde à la fin (FR171) ; registre déclaratif distinct des dépenses, sur le même principe que l'acompte (D011, BR055/BR097) — sans détention ni transfert d'argent par ChantierLive."}
  - {id: D089, status: VALIDATED, value: "Extension du modèle 5B (D053) : 6 tables commerciales ajoutées (plan_catalog_items, project_plans, quotes, quote_versions, change_orders, change_order_versions), nouveau domaine 'commercial' ; 43 → 49 tables. Ce modèle métier (agence avec devis/plans/avenants) reflète le retour d'UNE agence et n'est pas généralisé à tous les professionnels sans nouvelle décision explicite. PRÉCISION (revue de cohérence documentaire, décompte non révisé au fil des décisions suivantes) : D092 (ingénieur désigné), D095 (accès catalogue) et D096 (partage de plan SITE_MANAGER) ont chacune ajouté une table technique non comptée ici (plan_engineer_designations, plan_validations, catalog_access_grants, project_plan_shares) ; le domaine 'commercial' compte en réalité 10 tables au terme de ces extensions (T044–T053, DATABASE_TABLES.csv/DATA_MODEL.yaml), soit un sous-total de 43 → 53 pour ce seul domaine, et non 43 → 49. Ce sous-total documentaire (spécifié, pas déployé) reste distinct du total RÉELLEMENT déployé : aucune des 10 tables commerciales n'a de migration appliquée à ce jour (aucun fichier supabase/migrations/ pour M019 à M025) ; seule T054 (private_object_uploads, domaine integrity, B026) a été effectivement déployée depuis la base de 43, portant le total réellement déployé à 44."}
  - {id: D090, status: VALIDATED, value: "Budget prévisionnel interne (réutilise budgets/budget_versions, aucune nouvelle table) privé par défaut envers le client, sans exception de seuil, distinct du montant contractuel, des paiements reconnus et du reste dû (BR099) ; FR069 recentré sur CONTRACTOR seul, BUDGET_VIEW corrigé (owner N). Ferme O009."}
  - {id: D091, status: VALIDATED, value: "Confirmation explicite : la gestion du catalogue de plans est réservée au propriétaire de l'organisation via organizations.owner_profile_id (BR091, D076) ; la gestion par des collaborateurs (organization_memberships) reste différée, sans mécanisme ni droit créé pour eux."}
  - {id: D092, status: VALIDATED, value: "Validation technique des plans par un ingénieur désigné par l'agence : désignation/révocation par le propriétaire de l'organisation, compte identifié et vérifié, périmètre organisationnel précis, contrôle de l'habilitation courante à chaque validation ; son identité, la version examinée et sa décision sont enregistrées ; aucun pouvoir implicite lié au rôle CONTRACTOR, aucun accès financier supplémentaire, aucune certification ChantierLive sous-entendue. Ferme O010 sur cet arbitrage métier."}
  - {id: D093, status: PROPOSED, value: "Traduction technique PROPOSÉE par l'équipe (PAS un arbitrage du fondateur) de D092 : tables plan_engineer_designations/plan_validations (migration M023). Modalités précises (fonctions SQL de contrôle d'habilitation, intégration RPC, tests de sécurité) restent entièrement à concevoir lors de l'implémentation de L02c. L'approbation du backlog de 68 tâches (2026-09-24) NE VALIDE PAS ces tables ni cette migration — seule D092 est un arbitrage du fondateur. PRÉCISION (B062 clôturée) : plan_engineer_designations a depuis été implémentée et testée (20260926140000/20260926150000, hors périmètre L02c) — désignation/révocation par le propriétaire, isolation par organisation, anti-énumération, aucun droit chantier/financier implicite. plan_validations reste, elle, une table strictement PROPOSÉE, non implémentée, dépendante de project_plans (M020/B063-B064) non construite. PRÉCISION (B064, EN REVUE, non validée) : plan_validations est désormais implémentée par la migration M023b (20260927180000, avec project_plan_publications et projects.published_plan_version_id) et project_plan_shares par M025 (20260927190000), selon D108-D111 ; statut PROPOSED conservé jusqu'à la validation de B064 par le fondateur."}
  - {id: D094, status: VALIDATED, value: "Autorisation de démarrage des travaux (B067) : CONTRACTOR SEUL autorise, sans confirmation OWNER, sous trois conditions cumulatives revérifiées côté serveur au moment de la décision : devis accepté par le client ; totalité de l'avance exigée reconnue comme reçue, y compris si plusieurs versements la composent (BR103) ; validation technique enregistrée pour la version du plan concernée. Auteur et heure du démarrage enregistrés, visibles du client (exception explicite à la confidentialité interne, BR098)."}
  - {id: D095, status: VALIDATED, value: "Catalogue avant chantier : un client connecté peut consulter les modèles PUBLIÉS d'une agence via un lien commercial (invitation de l'agence), même sans chantier — présentation limitée aux aperçus et descriptions, aucun accès aux fichiers techniques privés (BR104, table catalog_access_grants). Ce lien ne crée aucune adhésion chantier (project_memberships) ni organisationnelle (organization_memberships)."}
  - {id: D096, status: VALIDATED, value: "Plans publiés au chantier : lecture autorisée à OWNER/PRIMARY, CO_OWNER et CONTRACTOR dont l'adhésion chantier est active. SITE_MANAGER actif : accès uniquement sur octroi EXPLICITE au document par le CONTRACTOR habilité (table project_plan_shares) — autorisation documentaire distincte des délégations PHASE_EDIT_DRAFT ; les quatre codes existants de membership_permissions ne sont pas détournés pour cet usage."}
  - {id: D097, status: VALIDATED, value: "Ingénieur désigné : lecture limitée aux versions qui lui ont été soumises, y compris après sa décision, tant que sa désignation reste active (BR105). La révocation de la désignation retire l'accès qui en découlait ; la décision historique (plan_validations) reste conservée et consultable par les autres titulaires de droits, jamais supprimée."}
  - {id: D098, status: VALIDATED, value: "Dépôt client : le client conserve la lecture de son propre dépôt tant que son adhésion chantier reste active (BR106) ; aucune nouvelle exigence de compte vérifié n'est ajoutée pour cette seule lecture. Les contrôles déjà en vigueur sur les opérations sensibles restent inchangés."}
  - {id: D099, status: VALIDATED, value: "Périmètre initial MEDIA_UPLOAD : CONTRACTOR et SITE_MANAGER ajoutent un média avec la seule adhésion chantier active, sans délégation supplémentaire. OWNER/PRIMARY conserve la consultation selon les règles de visibilité existantes ; l'ajout n'est pas livré pour OWNER/PRIMARY dans ce premier périmètre. L'ancien C (owner_primary) reste documenté comme exigence à clarifier ultérieurement, non supprimé silencieusement. Cette décision ne restreint pas le dépôt d'un plan client, déjà régi séparément par PLAN_DEPOSIT."}
  - {id: D100, status: VALIDATED, value: "Visibilité des photos/vidéos de suivi (media_assets) : après finalisation technique de l'upload, le média reste en BROUILLON, lisible uniquement par son auteur tant qu'il reste CONTRACTOR ou SITE_MANAGER actif sur le chantier. Publication explicite par cet auteur, droits revérifiés côté serveur au moment de la publication. Après publication : visibilité « équipe du chantier », lecture réservée aux membres actifs autorisés par MEDIA_VIEW. Toute lecture exige en outre que l'upload privé lié (private_object_uploads) soit FINALIZED. Ces règles concernent exclusivement les photos/vidéos de suivi ; elles ne s'appliquent ni aux plans, ni aux justificatifs, ni aux autres documents privés, dont la visibilité reste régie séparément."}
  - {id: D101, status: VALIDATED, value: "B063 (rattachement d'un plan au chantier) — acteurs du dépôt : OWNER_PRIMARY (déjà autonome, PERMISSIONS.csv) et CONTRACTOR peuvent chacun déposer un plan candidat de façon autonome. CO_OWNER et SITE_MANAGER sont refusés, mais UNIQUEMENT pour les actes propres à B063 (dépôt, proposition, partage, désignation du retenu) — ce refus ne modifie aucun droit déjà validé sur les plans PUBLIÉS (project_plan_shares/PLAN_VIEW, D096, hors périmètre de B063)."}
  - {id: D102, status: VALIDATED, value: "B063 — un chantier peut conserver plusieurs plans candidats (dépôts/versions) sans fusion ni remplacement silencieux ; un seul est explicitement désigné « retenu » à un instant donné."}
  - {id: D103, status: VALIDATED, value: "B063 — CONTRACTOR propose des plans candidats ; seul OWNER_PRIMARY désigne explicitement lequel est retenu. Cette désignation n'est ni une validation technique (réservée à l'ingénieur désigné, B064) ni une autorisation de démarrage des travaux (déjà réservée à CONTRACTOR seul, D094/BR101)."}
  - {id: D104, status: VALIDATED, value: "B063 — concerne UNIQUEMENT les plans déposés par CONTRACTOR : avant qu'OWNER_PRIMARY puisse en désigner un comme retenu, CONTRACTOR doit d'abord le partager explicitement avec lui, acte distinct de la désignation elle-même — la désignation retenu ne doit jamais devenir, de fait, le seul mécanisme donnant accès au fichier. OWNER_PRIMARY peut désigner retenu son PROPRE dépôt sans aucun partage préalable (cf. D098, lecture déjà acquise sur son propre dépôt)."}
  - {id: D105, status: VALIDATED, value: "B063 — un plan déposé par OWNER_PRIMARY reste consultable par lui-même (D098) ET par le CONTRACTOR actif du chantier, dès le dépôt, sans acte de partage requis dans ce sens (asymétrique de D104, qui ne s'applique qu'aux dépôts CONTRACTOR)."}
  - {id: D106, status: VALIDATED, value: "B063 — une validation technique (B064) reste attachée définitivement à la version qu'elle a examinée. Si le plan retenu change, cette preuve historique n'est ni supprimée ni transférée au nouveau plan retenu ; une nouvelle validation serait nécessaire pour lui avant toute autorisation de démarrage qui en dépendrait."}
  - {id: D107, status: VALIDATED, value: "B063 — sélectionner un plan depuis le catalogue exige deux droits distincts : habilitation chantier (OWNER_PRIMARY/CONTRACTOR actif) ET accès en lecture au catalogue de l'organisation du chantier (cohérence organization_id vérifiée) ; ce second droit reste aujourd'hui réservé au seul propriétaire de l'organisation (D091/BR091). FR175 permet la présentation du catalogue SANS EXIGER de chantier (pas exclusivement avant sa création), mais ne donne aucun accès automatique aux fichiers techniques ni au CONTRACTOR externe à l'organisation — son périmètre reste la présentation limitée déjà décidée (aperçus/descriptions, D095/BR104), jamais un accès élargi au fichier technique ni à un tiers non-propriétaire. FR175 demeure NON livrée à ce jour."}
  - {id: D108, status: VALIDATED, value: "B064 — chantier sans organisation rattachée (projects.organization_id NULL) : la soumission d'une version à un ingénieur est refusée explicitement (no_organization), aucun rattachement ni droit n'est déduit ; le dépôt et le choix du plan retenu (B063) restent possibles."}
  - {id: D109, status: VALIDATED, value: "B064 — la soumission à l'ingénieur désigné est réservée au CONTRACTOR actif du chantier, uniquement pour une version qu'il peut consulter (project_plan_version_readable) et à une désignation active de l'organisation du chantier ; OWNER/PRIMARY ne soumet pas."}
  - {id: D110, status: VALIDATED, value: "B064 — publication au chantier par le CONTRACTOR actif, uniquement pour le plan retenu dont CETTE version porte une validation technique VALIDATED ; republication explicite autorisée dans les mêmes conditions, historique conservé par insertion (project_plan_publications), jamais de remplacement automatique (un changement du plan retenu ne modifie pas le plan publié). Validation technique, publication et autorisation de démarrage (B067) restent trois actes distincts. Une demande de validation passe de PENDING à un état terminal (VALIDATED, REJECTED ou CANCELLED) puis devient immuable."}
  - {id: D111, status: VALIDATED, value: "B064 — partage explicite minimal SITE_MANAGER prévu par D096 (project_plan_shares, T053) inclus : le CONTRACTOR actif octroie ou révoque, document par document, l'accès d'un SITE_MANAGER actif au plan ACTUELLEMENT publié ; aucun accès aux brouillons, aux candidats non publiés ni aux versions remplacées, et aucune réutilisation des délégations membership_permissions."}
